<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes ssBlockIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
</style>
</helmet>

<div style="min-height:100vh; background-color:#2B2620; background-image:url('uploads/i_want_and_animated_gif_that_a-ezgif.com-video-to-gif-converter.gif'); background-size:cover; background-position:center; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; position:relative;">

  <div style="position:absolute; inset:0; background:rgba(32,28,22,0.5);"></div>

  <button onClick="{{ onSkip }}" style="position:absolute; top:24px; right:24px; z-index:1; background:rgba(250,248,244,0.12); color:#FAF8F4; border:1px solid rgba(250,248,244,0.3); padding:9px 16px; border-radius:8px; font-size:13px; cursor:pointer;">Enter</button>

  <audio src="uploads/i_want_and_animated_gif_that_a.mp3" ref="{{ audioRef }}" style="display:none;"></audio>

  <div style="text-align:center; max-width:640px; margin-bottom:44px; position:relative; z-index:1;">
    <h1 style="font-family:'Fraunces',serif; font-weight:500; font-size:clamp(24px,4vw,34px); color:#FAF8F4; line-height:1.3; margin:0;">Unlock an ocean of opportunities with our simple, one-time onboarding.</h1>
  </div>

  <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center; position:relative; z-index:1;">
    <sc-if value="{{ showBlock1 }}">
      <div style="width:220px; background:rgba(250,248,244,0.08); border:1px solid rgba(250,248,244,0.25); border-radius:14px; padding:24px; animation:ssBlockIn 0.6s ease both;">
        <div style="font-family:'Fraunces',serif; font-size:12px; color:#E8DFC8; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;">First</div>
        <div style="font-family:'Fraunces',serif; font-size:19px; color:#FAF8F4; font-weight:500;">Identity</div>
      </div>
    </sc-if>
    <sc-if value="{{ showBlock2 }}">
      <div style="width:220px; background:rgba(250,248,244,0.08); border:1px solid rgba(250,248,244,0.25); border-radius:14px; padding:24px; animation:ssBlockIn 0.6s ease both;">
        <div style="font-family:'Fraunces',serif; font-size:12px; color:#E8DFC8; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;">Then</div>
        <div style="font-family:'Fraunces',serif; font-size:19px; color:#FAF8F4; font-weight:500;">Financials</div>
      </div>
    </sc-if>
    <sc-if value="{{ showBlock3 }}">
      <div style="width:220px; background:rgba(250,248,244,0.08); border:1px solid rgba(250,248,244,0.25); border-radius:14px; padding:24px; animation:ssBlockIn 0.6s ease both;">
        <div style="font-family:'Fraunces',serif; font-size:12px; color:#E8DFC8; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;">Alongside</div>
        <div style="font-family:'Fraunces',serif; font-size:19px; color:#FAF8F4; font-weight:500;">Portfolio</div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ showEntering }}">
    <div style="margin-top:36px; color:#E8DFC8; font-size:13px; position:relative; z-index:1;">Setting up your dashboard…</div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:600},&quot;step&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;onSkip&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  audioRef = React.createRef();

  componentDidMount() {
    if (this.audioRef.current) {
      this.audioRef.current.volume = 0.6;
      this.audioRef.current.play().catch(() => {});
    }
  }

  renderVals() {
    const step = this.props.step || 0;
    return {
      onSkip: this.props.onSkip,
      audioRef: this.audioRef,
      showBlock1: step >= 1,
      showBlock2: step >= 2,
      showBlock3: step >= 3,
      showEntering: step >= 3
    };
  }
}

</script>
</body>
</html>
