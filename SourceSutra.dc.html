<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./rfq-store.js"></script>
<style>
  body { margin: 0; background: #FAF8F4; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  ::selection { background: #403A77; color: #FAF8F4; }
  a { color: #403A77; }
  a:hover { color: #6C6AA0; }
  input, select, textarea, button { font-family: 'Inter', sans-serif; }
  input:focus, select:focus, textarea:focus, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #403A77; outline-offset: 2px;
  }
  @keyframes weaveIn { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
  @keyframes floatUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } }
</style>
</helmet>

<div style="min-height:100vh; background:#FAF8F4; color:#20202B;">

<sc-if value="{{ isLanding }}" hint-placeholder-val="{{ true }}">
  <dc-import name="ScreenLanding" hint-size="100%,100%"
    on-signup="{{ handleSignup }}" stats="{{ stats }}" testimonials="{{ testimonials }}"></dc-import>
</sc-if>

<sc-if value="{{ isIntro }}">
  <dc-import name="ScreenIntro" hint-size="100%,100%"
    step="{{ introStep }}" reduced-motion="{{ prefersReducedMotion }}" on-skip="{{ handleSkipIntro }}"></dc-import>
</sc-if>

<sc-if value="{{ isDashboard }}">
  <sc-if value="{{ showSupplierShellTabs }}" hint-placeholder-val="{{ false }}">
    <div style="position:sticky; top:0; z-index:20; background:#FAF8F4; border-bottom:1px solid #E4DFD5;">
      <div style="max-width:1080px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:6px; overflow-x:auto;">
        <sc-for list="{{ supplierTabs }}" as="tab" hint-placeholder-count="3">
          <button onClick="{{ tab.onClick }}" style="background:none; border:none; padding:9px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; cursor:pointer; color:{{ tab.color }}; border-bottom:2px solid {{ tab.border }};">{{ tab.label }}</button>
        </sc-for>
        <sc-if value="{{ showHeaderActions }}" hint-placeholder-val="{{ false }}">
          <div style="margin-left:auto; display:flex; align-items:center; gap:12px;">
            <div style="display:flex; align-items:center; gap:1px; background:#F2EEE6; border:1px solid #E4DFD5; border-radius:8px; padding:2px;">
              <a href="SourceSutraCustomer.dc.html" style="color:#6B6A78; padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; white-space:nowrap; text-decoration:none;">Customer</a>
              <button style="background:#403A77; color:#FAF8F4; border:none; padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:default; white-space:nowrap;">Supplier</button>
            </div>
            <button onClick="{{ handleLogout }}" style="background:none; border:1px solid #E4DFD5; color:#6B6A78; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap;">Log out</button>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showMyProfile }}" hint-placeholder-val="{{ true }}">
    <dc-import name="ScreenDashboard" hint-size="100%,100%"
      active-section="{{ activeSectionOrNull }}"
      overall-status="{{ overallStatus }}"
      overall-status-style="{{ overallStatusStyle }}"
      overall-status-desc="{{ overallStatusDesc }}"
      is-onboarding-completed="{{ isOnboardingCompleted }}"
      progress-percent="{{ progressPercent }}"
      weave-slots="{{ weaveSlots }}"
      section-cards="{{ sectionCards }}"
      scenario="{{ scenario }}"
      scenario-options="{{ scenarioOptions }}"
      on-open-section="{{ openSection }}"
      on-back="{{ backToOverview }}"
      on-logout="{{ handleLogout }}"
      identity="{{ identityVals }}"
      financials="{{ financialsVals }}"
      portfolio="{{ portfolioVals }}"
    ></dc-import>
  </sc-if>

  <sc-if value="{{ showDiscoverRfqs }}" hint-placeholder-val="{{ false }}">
    <dc-import name="SupplierDiscoverRFQs" hint-size="100%,100%"
      rfqs="{{ filteredRfqs }}" total="{{ rfqsTotal }}"
      contract-types="{{ rfqContractTypes }}" locations="{{ rfqLocations }}"
      active-type="{{ rfqFilterType }}" active-location="{{ rfqFilterLocation }}" search-query="{{ rfqSearchQuery }}"
      on-type="{{ setRfqFilterTypeH }}" on-location="{{ setRfqFilterLocationH }}" on-search-change="{{ setRfqSearchQueryH }}"
      on-clear-filters="{{ clearRfqFilters }}" on-open-rfq="{{ openRfq }}"
    ></dc-import>
  </sc-if>

  <sc-if value="{{ showRfqDetail }}" hint-placeholder-val="{{ false }}">
    <dc-import name="SupplierRFQDetail" hint-size="100%,100%"
      rfq="{{ selectedRfq }}" existing-quote="{{ existingQuoteForRfq }}"
      on-back="{{ backToDiscoverRfqs }}" on-create-quote="{{ startQuote }}" on-view-quote="{{ editQuote }}"
    ></dc-import>
  </sc-if>

  <sc-if value="{{ showCreateQuote }}" hint-placeholder-val="{{ false }}">
    <dc-import name="SupplierCreateQuote" hint-size="100%,100%"
      rfq="{{ selectedRfq }}" existing-quote="{{ existingQuoteForRfq }}" supplier-capabilities="{{ portfolioVals.customizationCapabilities }}" supplier-certifications="{{ portfolioVals.certifications }}"
      on-back="{{ backToRfqDetailH }}" on-save-draft="{{ saveQuoteDraft }}" on-submit="{{ submitQuote }}" on-discard="{{ discardQuote }}"
    ></dc-import>
  </sc-if>

  <sc-if value="{{ showQuotations }}" hint-placeholder-val="{{ false }}">
    <dc-import name="SupplierQuotations" hint-size="100%,100%"
      quotes="{{ quotesWithRfq }}" invitations="{{ invitationsWithRfq }}"
      on-open-quote="{{ openQuoteFromList }}" on-open-invitation="{{ openRfq }}"
    ></dc-import>
  </sc-if>
</sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const CERT_CATEGORIES = ['Quality Management', 'Environmental Management', 'Health & Safety', 'Social Compliance', 'Sustainable & Organic Textiles', 'Recycled Materials', 'Chemical & Product Safety', 'Responsible Materials', 'Indian Regulatory & Legal Compliance', 'Buyer / Brand Audits', 'Other'];
const CERT_NAME_OPTIONS = {
  'Quality Management': ['ISO 9001', 'Other — type your own'],
  'Environmental Management': ['ISO 14001', 'ISO 50001', 'Other — type your own'],
  'Health & Safety': ['ISO 45001', 'Other — type your own'],
  'Social Compliance': ['SA8000', 'WRAP', 'BSCI', 'SMETA / SEDEX', 'Other — type your own'],
  'Sustainable & Organic Textiles': ['GOTS', 'OCS', 'OEKO-TEX Standard 100', 'Other — type your own'],
  'Recycled Materials': ['GRS', 'RCS', 'Other — type your own'],
  'Responsible Materials': ['RDS (Responsible Down Standard)', 'RWS (Responsible Wool Standard)', 'RMS (Responsible Mohair Standard)', 'FSC', 'Other — type your own'],
  'Indian Regulatory & Legal Compliance': ['Import Export Code (IEC)', 'Factory Licence', 'Pollution Control / Environmental Consent', 'BIS Certification', 'Other — type your own']
};
const CERT_FREE_TEXT_CATEGORIES = ['Chemical & Product Safety', 'Other'];
const AUDIT_TYPE_OPTIONS = ['Social compliance audit', 'Quality audit', 'Ethical audit', 'Technical/capability audit', 'Other'];
const AUDIT_OUTCOME_OPTIONS = ['Passed', 'Passed with corrective actions', 'Failed', 'Pending result'];
const INVITED_RFQ_IDS = ['rfq1', 'rfq4'];

function computeCertBadge(c) {
  if (c.category === 'Buyer / Brand Audits') return { label: c.outcome || 'Pending result', bg: c.outcome === 'Passed' ? '#EFF3EE' : c.outcome === 'Failed' ? '#F7ECE8' : '#F2EEE6', fg: c.outcome === 'Passed' ? '#5B7A5B' : c.outcome === 'Failed' ? '#B5654A' : '#6B6A78' };
  if (c.fieldStatus === 'needs_correction') return { label: 'Needs correction', bg: '#F7ECE8', fg: '#B5654A' };
  const expired = !c.doesNotExpire && c.expiryDate && new Date(c.expiryDate) < new Date();
  if (expired) return { label: 'Expired', bg: '#F7ECE8', fg: '#B5654A' };
  const daysToExpiry = (!c.doesNotExpire && c.expiryDate) ? (new Date(c.expiryDate) - new Date()) / 86400000 : null;
  const expiringSoon = daysToExpiry !== null && daysToExpiry >= 0 && daysToExpiry <= 60;
  if (expiringSoon) return { label: 'Expiring soon', bg: '#FBF1DE', fg: '#B07A17' };
  if (c.fieldStatus === 'verified') return { label: 'Verified', bg: '#EFF3EE', fg: '#5B7A5B' };
  return { label: 'Self-declared', bg: '#EDECF6', fg: '#403A77' };
}

class Component extends DCLogic {
  state = {
    screen: 'landing',
    activeSection: null,
    introStep: 0,
    supplierScreen: 'profile',
    selectedRfqId: null,
    rfqs: (window.RFQStore ? window.RFQStore.getRfqs() : []),
    quotes: (window.RFQStore ? window.RFQStore.getQuotes() : []),
    editingQuoteId: null,
    rfqFilterType: '', rfqFilterLocation: '', rfqSearchQuery: '',

    identity: {
      company: '', contactName: '', designation: 'Owner',
      aadhaarVerified: false, aadhaarLast4: '', aadhaarStage: 'idle',
      email: '', emailOtpStage: 'idle', emailVerified: false, emailLanguage: 'English',
      phone: '', phoneOtpStage: 'idle', phoneVerified: false,
      altContact: '', website: '',
      directors: [],
      established: '', natureOfBusiness: '', yearsInBusiness: '',
      docs: {

      mgt7: [
        { id: 'fy2223', year: 'FY 2022–23', status: 'empty', fileName: '' },
        { id: 'fy2324', year: 'FY 2023–24', status: 'empty', fileName: '' },
        { id: 'fy2425', year: 'FY 2024–25', status: 'empty', fileName: '' }

  // ---------- navigation ----------
  componentDidMount() {
    this._prm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!window.RFQStore || this.state.rfqs.length === 0) {
      const tryLoad = () => {
        if (window.RFQStore) this.setState({ rfqs: window.RFQStore.getRfqs(), quotes: window.RFQStore.getQuotes() });
        else setTimeout(tryLoad, 50);
      };
      tryLoad();
    }
  }
  handleSignup = () => {
    this.setState({ screen: 'intro', introStep: 0 });
    // No auto-advance: the intro plays, then waits for the user to click "Enter"
    // (handleSkipIntro). Reduced-motion shows the final state at once, also waiting.
    if (this._prm) { this.setState({ introStep: 3 }); return; }
    this._timer1 = setTimeout(() => this.setState({ introStep: 1 }), 700);
    this._timer2 = setTimeout(() => this.setState({ introStep: 2 }), 1500);
    this._timer3 = setTimeout(() => this.setState({ introStep: 3 }), 2300);
  };
  handleSkipIntro = () => {
    [this._timer1, this._timer2, this._timer3].forEach(t => t && clearTimeout(t));
    this._goDashboard();
  };
  _goDashboard = () => this.setState({ screen: 'dashboard' });

  openSection = (id) => {
    if (id === 'financials' && this.isFinancialsLocked()) return;
    this.setState({ activeSection: id });
  };
  backToOverview = () => this.setState({ activeSection: null });
  handleLogout = () => this.setState({ screen: 'landing', supplierScreen: 'profile', selectedRfqId: null });

  goSupplierScreen = (screen) => this.setState({ supplierScreen: screen, selectedRfqId: null });
  openRfq = (id) => this.setState({ supplierScreen: 'rfq_detail', selectedRfqId: id });
  backToDiscoverRfqs = () => this.setState({ supplierScreen: 'discover_rfqs', selectedRfqId: null });
  backToRfqDetail = (id) => this.setState({ supplierScreen: 'rfq_detail', selectedRfqId: id });
  startQuote = (rfqId) => this.setState({ supplierScreen: 'create_quote', selectedRfqId: rfqId });
  editQuote = (quoteId) => { const q = this.state.quotes.find(x => x.id === quoteId); this.setState({ supplierScreen: 'create_quote', selectedRfqId: q ? q.rfqId : null, editingQuoteId: quoteId }); };
  setRfqFilterType = (v) => this.setState({ rfqFilterType: v });
  setRfqFilterLocation = (v) => this.setState({ rfqFilterLocation: v });
  setRfqSearchQuery = (v) => this.setState({ rfqSearchQuery: v });

  saveQuoteDraft = (quoteData) => {
    this.setState(s => {
      const existing = s.quotes.find(q => q.id === quoteData.id);
      const supplierName = s.identity.company || 'Your company';
      const full = { ...(existing || {}), ...quoteData, status: 'draft', supplierName };
      if (window.RFQStore) window.RFQStore.upsertQuote(full);
      const quotes = existing ? s.quotes.map(q => q.id === quoteData.id ? full : q) : [...s.quotes, full];
      return { quotes, editingQuoteId: null };
    });
  };
  submitQuote = (quoteData) => {
    this.setState(s => {
      const existing = s.quotes.find(q => q.id === quoteData.id);
      const submittedDate = new Date().toISOString().slice(0, 10);
      const supplierName = s.identity.company || 'Your company';
      const full = { ...(existing || {}), ...quoteData, status: 'submitted', submittedDate, supplierName };
      if (window.RFQStore) window.RFQStore.upsertQuote(full);
      const quotes = existing ? s.quotes.map(q => q.id === quoteData.id ? full : q) : [...s.quotes, full];
      return { quotes, supplierScreen: 'quotations', editingQuoteId: null };
    });
  };
  discardQuote = (quoteId) => { if (window.RFQStore) window.RFQStore.deleteQuote(quoteId); this.setState(s => ({ quotes: s.quotes.filter(q => q.id !== quoteId), supplierScreen: 'quotations', editingQuoteId: null })); };

    const s = this.state.identity.status;
    return s === 'not_started' || s === 'draft';
  }

  computeOverallStatus() {
    const { identity, financials, portfolio } = this.state;
    if (identity.status === 'remediation' || financials.status === 'remediation') return 'Verification – Remediation Required';
    if (identity.status === 'submitted_pending' || financials.status === 'submitted_pending') return 'Verification In Progress';
    if (identity.status === 'verified' && financials.status === 'verified') {
      if (portfolio.status === 'submitted_pending' || portfolio.status === 'verified') return 'Onboarding Completed';
      return 'Verification Completed – Portfolio Required';
    }
    if (identity.status === 'not_started' && financials.status === 'not_started' && portfolio.status === 'not_started') return 'To be Started';
    return 'Draft';
  }

  statusStyle(label) {
    const map = {
      'To be Started': { bg: '#F2EEE6', fg: '#6B6A78', border: '#E4DFD5' },
      'Draft': { bg: '#EDECF6', fg: '#403A77', border: '#D6D4EC' },
      'Verification In Progress': { bg: '#403A77', fg: '#FAF8F4', border: '#403A77' },
      'Verification – Remediation Required': { bg: '#F7ECE8', fg: '#B5654A', border: '#EAD1C7' },
      'Verification Completed – Portfolio Required': { bg: '#EFF3EE', fg: '#5B7A5B', border: '#D6E3D6' },
      'Onboarding Completed': { bg: '#5B7A5B', fg: '#FAF8F4', border: '#5B7A5B' }
    };
    return map[label] || map['To be Started'];
  }

  sectionWeight(status) {
    const map = { not_started: 0, draft: 0.45, submitted_pending: 0.8, remediation: 0.6, verified: 1 };
    return map[status] ?? 0;
  }

  computeProgressPercent() {
    const { identity, financials, portfolio } = this.state;
    const pct = (this.sectionWeight(identity.status) * 0.4 + this.sectionWeight(financials.status) * 0.4 + this.sectionWeight(portfolio.status) * 0.2) * 100;
    return Math.round(pct);
  }

  weaveSlots() {
    const pct = this.computeProgressPercent();
    const total = 18;
    const filledCount = Math.round((pct / 100) * total);
    const arr = [];
    for (let i = 0; i < total; i++) arr.push({ id: i, filled: i < filledCount });
    return arr;
  }

  sectionStatusLabel(status) {
    const map = { not_started: 'To be started', draft: 'Draft', submitted_pending: 'In verification', remediation: 'Needs correction', verified: 'Verified' };
    return map[status] || 'To be started';
  }

    }));

    const identityVals = {
      ...identity,
      docs: identityDocs,
      directorsList: directors,
      statusLabel: this.sectionStatusLabel(identity.status),
      designationOptions: ['Owner', 'Partner', 'Director', 'Sales Lead', 'Sales Manager', 'Procurement Lead', 'Procurement Manager', 'Employee'],
      languageOptions: ['English', 'Hindi', 'Tamil', 'Gujarati', 'Punjabi'],
      onField: (f) => (e) => this.setIdentity(f, e.target.value),
      onAadhaarStart: this.startAadhaar,
      onAadhaarConfirm: this.confirmAadhaar,
      onEmailOtpSend: this.sendEmailOtp,
      onEmailOtpConfirm: this.confirmEmailOtp,
      onPhoneOtpSend: this.sendPhoneOtp,
      onPhoneOtpConfirm: this.confirmPhoneOtp,
      onAddDirector: this.addDirector,
      onSave: () => this.saveDraft('identity'),
      onSubmit: () => this.submitSection('identity'),
      onCancel: this.cancelSection
    };

    // Financials vals
    const mgt7 = financials.mgt7.map(m => ({ ...m, onUpload: () => this.uploadMgt7(m.id), onRemove: () => this.removeMgt7(m.id) }));
    const otherDocs = financials.otherDocs.map(o => ({ ...o, onUpload: () => this.uploadOtherDoc(o.id), onRemove: () => this.removeOtherDoc(o.id) }));
    const accountMismatch = financials.confirmAccountNumber.length > 0 && financials.accountNumber !== financials.confirmAccountNumber;
    const financialsVals = {
      ...financials,
      mgt7List: mgt7,
      otherDocsList: otherDocs,
      accountMismatch,
      statusLabel: this.sectionStatusLabel(financials.status),
      locked: financialsLocked,
      routingTypeOptions: ['IFSC', 'Bank Code', 'BSB', 'Sort Code', 'Transit Number & Institution Number'],
      onField: (f) => (e) => this.setFinancials(f, e.target.value),
      onBilling: (f) => (e) => this.setFinancialsNested('billing', f, e.target.value),
      onLegal: (f) => (e) => this.setFinancialsNested('legal', f, e.target.value),
      onTaxUpload: this.uploadFinLegalTax,
      onTaxRemove: this.removeFinLegalTax,
      onSignedUpload: this.uploadSignedForm,
      onSignedRemove: this.removeSignedForm,
      onRptUpload: this.uploadRpt,
      onRptRemove: this.removeRpt,
      onAddOtherDoc: this.addOtherDoc,
      onSave: () => this.saveDraft('financials'),
      onSubmit: () => this.submitSection('financials'),
      onCancel: this.cancelSection
    };

    // Portfolio vals
    const workList = portfolio.workHistory.map(w => ({
      ...w,
      onToggle: () => this.toggleWork(w.id),
      onRemove: () => this.removeWork(w.id),
      onClient: (e) => this.setWorkField(w.id, 'clientName', e.target.value),
      onRole: (e) => this.setWorkField(w.id, 'role', e.target.value),
      onFreq: (e) => this.setWorkField(w.id, 'frequency', e.target.value),
      onStart: (e) => this.setWorkField(w.id, 'startYear', e.target.value),
      onEnd: (e) => this.setWorkField(w.id, 'endYear', e.target.value),
      onDesc: (e) => this.setWorkField(w.id, 'description', e.target.value.slice(0, 1000))
    }));
    const catalogueList = portfolio.catalogue.map(c => ({ ...c, onRemove: () => this.removeCatalogueItem(c.id) }));
    const tagsList = portfolio.tags.map(t => ({ value: t, onRemove: () => this.removeTag(t) }));
    const suggestedTags = ['Knitted fabric', 'Woven fabric', 'Garment CMT', 'Embroidery', 'Dyeing & processing', 'Trims & accessories', 'White-label article', 'Greige fabric'].filter(t => !portfolio.tags.includes(t)).map(t => ({ value: t, onAdd: () => this.addTag(t) }));

    const capabilityTaxonomy = ['Fabric', 'Colour', 'GSM', 'Fit', 'Pattern', 'Labels', 'Hangtags', 'Packaging', 'Embroidery', 'Screen printing', 'Digital printing', 'Heat transfer', 'Wash/finish', 'Hardware', 'Trims'];
    const capabilityChips = capabilityTaxonomy.map(cap => {
      const active = portfolio.customizationCapabilities.includes(cap);
      return { value: cap, active, onClick: () => this.toggleCapability(cap), bg: active ? '#403A77' : '#fff', fg: active ? '#FAF8F4' : '#403A77', border: active ? '#403A77' : '#D6D4EC' };
    });

    const productList = portfolio.products.map(p => ({
      ...p,
      headerLabel: p.name ? (p.name + (p.category ? ' · ' + p.category : '')) : 'New product',
      onToggle: () => this.toggleProduct(p.id),
      onRemove: () => this.removeProduct(p.id),
      onName: (e) => this.setProductField(p.id, 'name', e.target.value),
      onCategory: (e) => this.setProductField(p.id, 'category', e.target.value),
      onMaterial: (e) => this.setProductField(p.id, 'material', e.target.value),
      onMoq: (e) => this.setProductField(p.id, 'moq', e.target.value),
      onPriceRange: (e) => this.setProductField(p.id, 'priceRange', e.target.value)
    }));

    const certList = portfolio.certifications.map(c => {
      const isAudit = c.category === 'Buyer / Brand Audits';
      const isFreeTextCategory = CERT_FREE_TEXT_CATEGORIES.includes(c.category);
      const nameOptions = CERT_NAME_OPTIONS[c.category] || [];
      const showCustomName = isFreeTextCategory || c.certName === 'Other — type your own';
      const badge = computeCertBadge(c);
      const displayName = isAudit ? (c.buyerName || 'New audit') : (showCustomName ? (c.customName || 'New certification') : (c.certName || 'New certification'));
      return {
        ...c, isAudit, isAuditNegated: !isAudit, isFreeTextCategory, showCustomName,
        showNameDropdown: !showCustomName && nameOptions.length > 0,
        customNamePlaceholder: c.category === 'Chemical & Product Safety' ? 'Standard / programme name (e.g. ZDHC, REACH) *' : 'Certification / licence name *',
        expiryOpacity: c.doesNotExpire ? 0.5 : 1,
        nameOptions,
        badge,
        headerLabel: isAudit ? ('Audit — ' + displayName) : displayName,
        onToggle: () => this.toggleCertification(c.id),
        onRemove: () => this.removeCertification(c.id),
        onCategory: (e) => { const cat = e.target.value; this.setState(s => ({ portfolio: { ...s.portfolio, certifications: s.portfolio.certifications.map(x => x.id === c.id ? { ...x, category: cat, certName: '', customName: '' } : x) } })); },
        onCertName: (e) => this.setCertField(c.id, 'certName', e.target.value),
        onCustomName: (e) => this.setCertField(c.id, 'customName', e.target.value),
        onNumber: (e) => this.setCertField(c.id, 'certNumber', e.target.value),
        onIssuingBody: (e) => this.setCertField(c.id, 'issuingBody', e.target.value),
        onScope: (e) => this.setCertField(c.id, 'scope', e.target.value),
        onFacility: (e) => this.setCertField(c.id, 'facility', e.target.value),
        onIssueDate: (e) => this.setCertField(c.id, 'issueDate', e.target.value),
        onExpiryDate: (e) => this.setCertField(c.id, 'expiryDate', e.target.value),
        onToggleDoesNotExpire: () => this.setCertField(c.id, 'doesNotExpire', !c.doesNotExpire),
        onLastAuditDate: (e) => this.setCertField(c.id, 'lastAuditDate', e.target.value),
        onNextAuditDate: (e) => this.setCertField(c.id, 'nextAuditDate', e.target.value),
        onVerificationUrl: (e) => this.setCertField(c.id, 'verificationUrl', e.target.value),
        onUploadCertDoc: () => this.uploadCertDoc(c.id),
        onRemoveCertDoc: () => this.removeCertDoc(c.id),
        certDocIsEmpty: c.certDocument.status === 'empty', certDocIsUploading: c.certDocument.status === 'uploading', certDocIsUploaded: c.certDocument.status === 'uploaded',
        evidenceList: c.supportingEvidence.map(e => ({ ...e, isUploading: e.status === 'uploading', isUploaded: e.status === 'uploaded', onRemove: () => this.removeSupportingEvidence(c.id, e.id) })),
        onAddEvidence: () => this.addSupportingEvidence(c.id),
        onBuyerName: (e) => this.setCertField(c.id, 'buyerName', e.target.value),
        onAuditType: (e) => this.setCertField(c.id, 'auditType', e.target.value),
        onAuditDate: (e) => this.setCertField(c.id, 'auditDate', e.target.value),
        onOutcome: (e) => this.setCertField(c.id, 'outcome', e.target.value),
        onUploadAuditReport: () => this.uploadAuditReport(c.id),
        onRemoveAuditReport: () => this.removeAuditReport(c.id),
        auditReportIsEmpty: c.auditReportDoc.status === 'empty', auditReportIsUploading: c.auditReportDoc.status === 'uploading', auditReportIsUploaded: c.auditReportDoc.status === 'uploaded'
      };
    });
    const certVerifiedCount = certList.filter(c => c.badge.label === 'Verified').length;
    const certExpiringCount = certList.filter(c => c.badge.label === 'Expiring soon').length;
    const certExpiredCount = certList.filter(c => c.badge.label === 'Expired').length;
    const certCategoriesCovered = new Set(portfolio.certifications.map(c => c.category).filter(Boolean)).size;
    const certSummary = { total: certList.length, verified: certVerifiedCount, expiringSoon: certExpiringCount, expired: certExpiredCount, categoriesCovered: certCategoriesCovered, categoriesTotal: CERT_CATEGORIES.length };

    const facilityPhotoList = portfolio.facilityPhotos.map(f => ({ ...f, isUploading: f.status === 'uploading', isUploaded: f.status === 'uploaded', onRemove: () => this.removeFacilityPhoto(f.id) }));

    const portfolioVals = {
      ...portfolio,
      statusLabel: this.sectionStatusLabel(portfolio.status),
      workList,
      catalogueList,
      tagsList,
      suggestedTags,
      capabilityChips,
      productList,
      noProducts: productList.length === 0,
      certList,
      noCerts: certList.length === 0,
      certSummary,
      certCategoryOptions: CERT_CATEGORIES,
      auditTypeOptions: AUDIT_TYPE_OPTIONS,
      outcomeOptions: AUDIT_OUTCOME_OPTIONS,
      facilityPhotoList,
      missionCount: portfolio.companyMission.length,
      roleOptions: ['Primary Contractor', 'Sub-Contractor'],
      freqOptions: ['One-time', 'Recurring', 'Annual Maintenance Contract'],
      onUploadLogo: this.uploadLogo,
      onRemoveLogo: this.removeLogo,
      onMissionChange: (e) => this.setMission(e.target.value),
      onFactoryArea: (e) => this.setProduction('factoryArea', e.target.value),
      onEmployees: (e) => this.setProduction('employees', e.target.value),
      onMonthlyCapacity: (e) => this.setProduction('monthlyCapacity', e.target.value),
      onProductionLines: (e) => this.setProduction('productionLines', e.target.value),
      onMoq: (e) => this.setTradeTerms('moq', e.target.value),
      onIncoterms: (e) => this.setTradeTerms('incoterms', e.target.value),
      onPaymentTerms: (e) => this.setTradeTerms('paymentTerms', e.target.value),
      onLeadTime: (e) => this.setTradeTerms('leadTime', e.target.value),
      onAddWork: this.addWork,
      onAddCatalogue: this.addCatalogueItem,
      onAddProduct: this.addProduct,
      onAddCertification: this.addCertification,
      onAddFacilityPhoto: this.addFacilityPhoto,
      onTagDraftChange: (e) => this.setTagDraft(e.target.value),
      onTagKeyDown: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.addTag(); } },
      onTagAddClick: () => this.addTag(),
      onSave: () => this.saveDraft('portfolio'),
      onSubmit: () => this.submitSection('portfolio'),
      onCancel: this.cancelSection
    };

    return {
      isLanding: screen === 'landing',
      isIntro: screen === 'intro',
      isDashboard: screen === 'dashboard',
      handleSignup: this.handleSignup,
      handleSkipIntro: this.handleSkipIntro,
      introStep,
      prefersReducedMotion: !!this._prm,
      stats: [
        { value: '2,400+', label: 'Verified suppliers on the network' },
        { value: '₹840 Cr', label: 'Articles sourced through verified suppliers' },
        { value: '9 days', label: 'Average time to verified, once submitted' }
      ],
      testimonials: [
        { quote: "We used to redo the same KYC paperwork for every new manufacturer that reached out. Getting verified once on SourceSutra and staying discoverable has cut that entirely — we just get called now.", name: 'Suresh Anand', role: 'Partner, Anand Knitfab', place: 'Tiruppur' },
        { quote: "Manufacturers found us for dyeing work we'd never have won through cold outreach. The verification took about a week, and we haven't had to repeat it since.", name: 'Kavita Sharma', role: 'Director, Bhilwara Processors', place: 'Bhilwara' }
      ],
      activeSectionOrNull: activeSection,
      isOnboardingCompleted,
      overallStatus, overallStatusStyle,
      overallStatusDesc: descMap[overallStatus],
      progressPercent: this.computeProgressPercent(),
      weaveSlots: this.weaveSlots(),
      sectionCards,
      scenario, scenarioOptions,
      openSection: this.openSection,
      backToOverview: this.backToOverview,
      handleLogout: this.handleLogout,
      identityVals, financialsVals, portfolioVals,

      showSupplierShellTabs: isOnboardingCompleted && !activeSection && screen === 'dashboard',
      showHeaderActions: isOnboardingCompleted && !activeSection && screen === 'dashboard' && supplierScreen !== 'profile',
      supplierTabs: [
        { id: 'profile', label: 'My profile' },
        { id: 'discover_rfqs', label: 'Discover RFQs' },
        { id: 'quotations', label: 'Quotations & invitations' }
      ].map(t => ({ ...t, onClick: () => this.goSupplierScreen(t.id), color: (supplierScreen === t.id || (t.id === 'discover_rfqs' && (supplierScreen === 'rfq_detail' || supplierScreen === 'create_quote'))) ? '#403A77' : '#6B6A78', border: (supplierScreen === t.id || (t.id === 'discover_rfqs' && (supplierScreen === 'rfq_detail' || supplierScreen === 'create_quote'))) ? '#403A77' : 'transparent' })),
      showMyProfile: supplierScreen === 'profile' || !isOnboardingCompleted,
      showDiscoverRfqs: isOnboardingCompleted && supplierScreen === 'discover_rfqs',
      showRfqDetail: isOnboardingCompleted && supplierScreen === 'rfq_detail',
      showCreateQuote: isOnboardingCompleted && supplierScreen === 'create_quote',
      showQuotations: isOnboardingCompleted && supplierScreen === 'quotations',

      filteredRfqs, rfqsTotal: rfqs.filter(r => r.status === 'active').length,
      rfqContractTypes, rfqLocations,
      rfqFilterType, rfqFilterLocation, rfqSearchQuery,
      setRfqFilterTypeH: (v) => this.setRfqFilterType(v),
      setRfqFilterLocationH: (v) => this.setRfqFilterLocation(v),
      setRfqSearchQueryH: (v) => this.setRfqSearchQuery(v),
      clearRfqFilters: () => this.setState({ rfqFilterType: '', rfqFilterLocation: '', rfqSearchQuery: '' }),
      openRfq: this.openRfq,
      backToDiscoverRfqs: this.backToDiscoverRfqs,
      backToRfqDetailH: () => this.backToRfqDetail(selectedRfqId),
      selectedRfq, existingQuoteForRfq,
      startQuote: this.startQuote,
      editQuote: this.editQuote,
      saveQuoteDraft: this.saveQuoteDraft,
      submitQuote: this.submitQuote,
      discardQuote: this.discardQuote,
      quotesWithRfq, invitationsWithRfq,
      openQuoteFromList: this.editQuote
    };
  }
}

</script>
</body>
</html>
