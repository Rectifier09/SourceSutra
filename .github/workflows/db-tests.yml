name: db-tests

# CI (BP-1 pgtap job + BP-2/INT-5 cloud-deploy job): run the pgTAP suite against a fresh
# Supabase stack whenever the database (migrations/tests/seed) changes, on every PR and
# on push to main. On push to main only, once the suite is green, push the migrations to
# the linked cloud project (ap-south-1) so main == what's live.
on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies all migrations)
        run: supabase db start
      - name: Run pgTAP suite
        run: supabase test db

  # INT-5: push migrations to the cloud project once pgTAP is green on main. Needs two
  # repo secrets (Settings -> Secrets and variables -> Actions), neither of which this
  # workflow can create for you:
  #   SUPABASE_ACCESS_TOKEN  -- personal access token, https://supabase.com/dashboard/account/tokens
  #   SUPABASE_DB_PASSWORD   -- the cloud project's Postgres password (set at project creation;
  #                             reset it from Dashboard -> Project Settings -> Database if lost)
  deploy:
    needs: pgtap
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the cloud project
        run: supabase link --project-ref wtbfwejothkzldfebjbm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push migrations to cloud
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
