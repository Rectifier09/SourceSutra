<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FAF8F4; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #403A77; } a:hover { color: #6C6AA0; }
  input, select, textarea, button { font-family: 'Inter', sans-serif; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid #403A77; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.001ms !important; } }
  .cs-tab:hover { color: #403A77; }
  .cs-cta:hover { opacity: 0.92; }
</style>
</helmet>

<div style="min-height:100vh; background:#FAF8F4;">
  <div style="position:sticky; top:0; z-index:20; background:#FAF8F4; border-bottom:1px solid #E4DFD5;">
    <div style="max-width:1180px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
      <div style="font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:#403A77; white-space:nowrap;">SourceSutra</div>
      <div style="display:flex; gap:6px; overflow-x:auto; flex:1;">
        <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="3">
          <button class="cs-tab" onClick="{{ tab.onClick }}" disabled="{{ tab.disabled }}" style="background:none; border:none; padding:10px 14px; font-size:14px; font-weight:600; white-space:nowrap; cursor:{{ tab.cursor }}; color:{{ tab.color }}; border-bottom:2px solid {{ tab.border }};">{{ tab.label }}</button>
        </sc-for>
      </div>
      <div style="display:flex; align-items:center; gap:1px; background:#F2EEE6; border:1px solid #E4DFD5; border-radius:8px; padding:2px;">
        <button style="background:#403A77; color:#FAF8F4; border:none; padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:default; white-space:nowrap;">Customer</button>
        <a href="SourceSutra.dc.html" style="color:#6B6A78; padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; white-space:nowrap; text-decoration:none;">Supplier</a>
      </div>
      <button onClick="{{ onLogout }}" style="background:none; border:1px solid #E4DFD5; color:#6B6A78; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap;">Log out</button>
      <button class="cs-cta" onClick="{{ onOpenCreateRfq }}" style="background:#403A77; color:#FAF8F4; border:none; padding:10px 18px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;">+ Create RFQ</button>
    </div>
  </div>

  <sc-if value="{{ showCreateRfq }}" hint-placeholder-val="{{ false }}">
    <dc-import name="CustomerCreateRFQ" hint-size="100%,100%" prefill-supplier="{{ rfqPrefillSupplier }}" existing-rfq="{{ resumeRfq }}" on-cancel="{{ closeCreateRfq }}" on-publish="{{ closeCreateRfq }}"></dc-import>
  </sc-if>

  <sc-if value="{{ showProfileNotRfq }}">
    <dc-import name="CustomerSupplierProfile" hint-size="100%,100%" supplier="{{ selectedSupplier }}" on-back="{{ backToDiscover }}" on-create-rfq="{{ openCreateRfqFor }}"></dc-import>
  </sc-if>

  <sc-if value="{{ showDiscoverTab }}">
    <dc-import name="CustomerDiscover" hint-size="100%,100%" suppliers="{{ filteredSuppliers }}" total="{{ totalCount }}"
      company-types="{{ companyTypes }}" locations="{{ locations }}" all-tags="{{ allTags }}"
      active-type="{{ filterType }}" active-location="{{ filterLocation }}" active-tags="{{ filterTags }}"
      search-open="{{ searchOpen }}" search-query="{{ searchQuery }}"
      on-type="{{ setFilterType }}" on-location="{{ setFilterLocation }}" on-toggle-tag="{{ toggleFilterTag }}"
      on-search-open="{{ openSearch }}" on-search-close="{{ closeSearch }}" on-search-change="{{ setSearchQuery }}"
      on-clear-filters="{{ clearFilters }}" on-open-supplier="{{ openSupplier }}"
    ></dc-import>
  </sc-if>

  <sc-if value="{{ showProfileTab }}">
    <dc-import name="CustomerProfile" hint-size="100%,100%"></dc-import>
  </sc-if>

  <sc-if value="{{ showRfqTab }}">
    <dc-import name="CustomerMyRFQs" hint-size="100%,100%" on-resume-draft="{{ onResumeDraft }}" on-view-supplier-profile="{{ onViewSupplierProfile }}"></dc-import>
  </sc-if>
</div>

</x-dc>

class Component extends DCLogic {
  state = {
    activeTab: 'discover',
    selectedSupplierId: null,
    showCreateRfq: false,
    rfqPrefillSupplier: null,
    resumeRfq: null,
    filterType: '', filterLocation: '', filterTags: [],
    searchOpen: false, searchQuery: ''
  };

  setTab = (tab) => this.setState({ activeTab: tab, selectedSupplierId: null });
  openSupplier = (id) => this.setState({ selectedSupplierId: id });
  backToDiscover = () => this.setState({ selectedSupplierId: null });
  openCreateRfq = () => this.setState({ showCreateRfq: true, rfqPrefillSupplier: null, resumeRfq: null });
  openCreateRfqFor = (supplierName) => this.setState({ showCreateRfq: true, rfqPrefillSupplier: supplierName, resumeRfq: null });
  onResumeDraft = (rfq) => this.setState({ showCreateRfq: true, rfqPrefillSupplier: null, resumeRfq: rfq });
  onViewSupplierProfile = (supplierName) => { const s = SUPPLIERS.find(x => x.name === supplierName); if (s) this.setState({ selectedSupplierId: s.id }); };
  closeCreateRfq = () => this.setState({ showCreateRfq: false, resumeRfq: null });

  setFilterType = (v) => this.setState({ filterType: v });
  setFilterLocation = (v) => this.setState({ filterLocation: v });
  toggleFilterTag = (tag) => this.setState(s => ({ filterTags: s.filterTags.includes(tag) ? s.filterTags.filter(t => t !== tag) : [...s.filterTags, tag] }));
  clearFilters = () => this.setState({ filterType: '', filterLocation: '', filterTags: [], searchQuery: '' });
  openSearch = () => this.setState({ searchOpen: true });
  closeSearch = () => { if (!this.state.searchQuery) this.setState({ searchOpen: false }); };
  setSearchQuery = (v) => this.setState({ searchQuery: v });

  renderVals() {
    const { activeTab, selectedSupplierId, showCreateRfq, filterType, filterLocation, filterTags, searchOpen, searchQuery, rfqPrefillSupplier } = this.state;
    const q = searchQuery.trim().toLowerCase();
    const filtered = SUPPLIERS.filter(s =>
      (!filterType || s.type === filterType) &&
      (!filterLocation || s.location === filterLocation) &&
      (filterTags.length === 0 || filterTags.every(t => s.tags.includes(t))) &&
      (!q || s.name.toLowerCase().includes(q) || s.mission.toLowerCase().includes(q))
    );
    const companyTypes = [...new Set(SUPPLIERS.map(s => s.type))];
    const locations = [...new Set(SUPPLIERS.map(s => s.location))];
    const allTags = [...new Set(SUPPLIERS.flatMap(s => s.tags))];
    const selectedSupplier = SUPPLIERS.find(s => s.id === selectedSupplierId) || null;

    const tabDefs = [
      { id: 'profile', label: 'Profile' },
      { id: 'discover', label: 'Discover suppliers' },
      { id: 'rfq', label: 'My RFQs' }
    ].map(t => ({ ...t, onClick: showCreateRfq ? undefined : () => this.setTab(t.id), disabled: showCreateRfq, cursor: showCreateRfq ? 'not-allowed' : 'pointer', color: showCreateRfq ? '#C7C5D6' : (activeTab === t.id && !selectedSupplierId ? '#403A77' : '#6B6A78'), border: activeTab === t.id && !selectedSupplierId && !showCreateRfq ? '#403A77' : 'transparent' }));

    return {
      tabs: tabDefs,
      onOpenCreateRfq: this.openCreateRfq,
      onLogout: () => { window.location.href = 'SourceSutra.dc.html'; },
      showCreateRfq,
      rfqPrefillSupplier,
      resumeRfq: this.state.resumeRfq,
      onResumeDraft: this.onResumeDraft,
      onViewSupplierProfile: this.onViewSupplierProfile,
      closeCreateRfq: this.closeCreateRfq,
      showProfileNotRfq: !showCreateRfq && !!selectedSupplierId,
      showDiscoverTab: !showCreateRfq && !selectedSupplierId && activeTab === 'discover',
      showProfileTab: !showCreateRfq && !selectedSupplierId && activeTab === 'profile',
      showRfqTab: !showCreateRfq && !selectedSupplierId && activeTab === 'rfq',
      selectedSupplier,
      backToDiscover: this.backToDiscover,
      openCreateRfqFor: this.openCreateRfqFor,
      filteredSuppliers: filtered,
      totalCount: SUPPLIERS.length,
      companyTypes, locations, allTags,
      filterType, filterLocation, filterTags,
      searchOpen, searchQuery,
      setFilterType: this.setFilterType,
      setFilterLocation: this.setFilterLocation,
      toggleFilterTag: this.toggleFilterTag,
      openSearch: this.openSearch,
      closeSearch: this.closeSearch,
      setSearchQuery: (e) => this.setSearchQuery(e.target.value),
      clearFilters: this.clearFilters,
      openSupplier: this.openSupplier
    };
  }
}

</script>
